name: Engine tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      INSTRUCTION_PROVIDER: rules
      DATABASE_URL: sqlite:///./data/ci.db
      LOCAL_STORAGE_DIR: ./data/ci-storage
      RENDER_OUTPUT_DIR: ./data/ci-renders
      TEMP_DIR: ./data/ci-temp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check frontend syntax
        run: node --check frontend/app.js
      - name: Run unit, integration, rendering, and end-to-end suites
        run: python -m pytest -q
