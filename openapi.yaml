components:
  schemas:
    ApplyPlanPayload:
      properties:
        operations:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Operations
      additionalProperties: true
      type: object
      title: ApplyPlanPayload
    BackgroundMusicPayload:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: true
        volume:
          type: number
          title: Volume
          default: 0.2
        ducking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ducking
        ducking_enabled:
          type: boolean
          title: Ducking Enabled
          default: true
      type: object
      title: BackgroundMusicPayload
    Body_upload_media_api_v1_media_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_media_api_v1_media_upload_post
    Body_upload_transcript_api_v1_transcript__media_id__upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_transcript_api_v1_transcript__media_id__upload_post
    Body_upload_voiceover_document_api_v1_voiceover__media_id__upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_voiceover_document_api_v1_voiceover__media_id__upload_post
    CaptionStylePayload:
      properties:
        font_family:
          type: string
          maxLength: 100
          minLength: 1
          title: Font Family
          default: Arial
        font_size:
          type: integer
          maximum: 120.0
          minimum: 8.0
          title: Font Size
          default: 24
        text_color:
          type: string
          title: Text Color
          default: '#FFFFFF'
        outline_color:
          type: string
          title: Outline Color
          default: '#000000'
        outline_width:
          type: integer
          maximum: 20.0
          minimum: 0.0
          title: Outline Width
          default: 2
        shadow_offset:
          type: integer
          maximum: 20.0
          minimum: 0.0
          title: Shadow Offset
          default: 1
        background_box:
          type: boolean
          title: Background Box
          default: false
        background_color:
          type: string
          title: Background Color
          default: '#000000'
        vertical_position:
          type: string
          title: Vertical Position
          default: bottom
      type: object
      title: CaptionStylePayload
    ClarificationAnswerRequest:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Clarification session ID
        selected_option_id:
          type: string
          title: Selected Option Id
          description: Selected option ID or index (e.g. opt_1)
      type: object
      required:
      - session_id
      - selected_option_id
      title: ClarificationAnswerRequest
    ClarificationOption:
      properties:
        id:
          type: string
          title: Id
          description: Stable identifier for choice, e.g. opt_1
        label:
          type: string
          title: Label
          description: Human readable summary of this choice
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Detailed context, timestamp, speaker
        target_data:
          additionalProperties: true
          type: object
          title: Target Data
          description: Pre-computed payload to execute if selected
      type: object
      required:
      - id
      - label
      title: ClarificationOption
    CommittedOperation:
      properties:
        operation_id:
          type: string
          title: Operation Id
        operation_type:
          $ref: '#/components/schemas/OperationType'
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
        previous_revision:
          type: integer
          title: Previous Revision
        resulting_revision:
          type: integer
          title: Resulting Revision
        status:
          type: string
          title: Status
          default: committed
        state:
          type: string
          pattern: ^(active|undone|disabled)$
          title: State
          default: active
        provenance:
          type: string
          title: Provenance
          default: engine
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - operation_id
      - operation_type
      - parameters
      - previous_revision
      - resulting_revision
      title: CommittedOperation
    CreateProjectPayload:
      properties:
        name:
