          type: integer
          exclusiveMinimum: 0.0
          title: Width
          description: Video width in pixels
        height:
          type: integer
          exclusiveMinimum: 0.0
          title: Height
          description: Video height in pixels
        frame_rate:
          type: number
          minimum: 0.0
          title: Frame Rate
