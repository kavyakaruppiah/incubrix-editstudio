  /api/v1/health:
    get:
      summary: Get Health
      operationId: get_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      summary: Get Readiness
      operationId: get_readiness_api_v1_ready_get
