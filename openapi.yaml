          type: boolean
          title: Is Vfr
          description: Whether media has variable frame rate
          default: false
        file_size:
          type: integer
          minimum: 0.0
          title: File Size
          description: File size in bytes
      type: object
      required:
      - duration
      - width
      - height
      - video_codec
      - file_size
      title: MediaMetadata
    OperationType:
      type: string
      enum:
