          type: string
          title: Created At
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
      type: object
      required:
      - media_id
      - original_filename
      - storage_filename
      - storage_path
      - file_size
      - sha256_hash
      - metadata
      title: MediaManifest
